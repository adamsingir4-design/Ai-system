version: '3.9'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: bash -lc "cd backend && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      - DATABASE_URL=sqlite:///./app.db
      - SECRET_KEY=dev-secret-key
      - AI_PROVIDER=fallback
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    depends_on:
      - backend
